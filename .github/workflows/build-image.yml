name: build-comfy-image

# Construit l'image custom InfiniteTalk (ComfyUI + nodes + venv + SageAttention)
# et la pousse sur ghcr.io. Déclenché manuellement ou quand le Dockerfile /
# setup-prod.sh changent.
on:
  workflow_dispatch: {}
  push:
    branches: [main, slim-image-v2, sage-multiarch]
    paths:
      - 'Dockerfile'
      - 'scripts/setup-prod.sh'
      - '.github/workflows/build-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # L'image (torch + ComfyUI + sage) dépasse l'espace par défaut du runner.
      # Build SLIM multi-étages = +gourmand (garde l'étage devel ~9 Go ET construit
      # le runtime) -> "No space left on device" si on ne libère pas agressivement
      # (échec :latest 2026-06-30). On purge tout le superflu du runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY" \
            /usr/local/lib/android /usr/local/share/boost /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/microsoft || true
          sudo apt-get clean || true
          docker image prune -af || true
          df -h /

      # Swap 16 Go sur le disque temporaire /mnt (≈65 Go libres, hors espace de build) :
      # le compile SageAttention multi-gencode (noyau _qattn_sm89, 7 .cu × 2 gencodes)
      # peut dépasser ponctuellement les ~16 Go RAM du runner — sans swap le kernel
      # OOM-kill l'agent du runner (log coupé net, 3 échecs 2026-06-30). Avec swap,
      # un pic mémoire ralentit le build au lieu de le tuer. Complète MAX_JOBS=1
      # (Dockerfile), désormais réellement appliqué (setup-prod.sh le respecte).
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # Tag = latest sur main (prod), candidate sur toute autre branche (validation
      # d'un pod de test AVANT promotion en :latest). Évite de casser la prod avec
      # une image non validée (revert 2026-06-29).
      - name: Compute image tag
        id: meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=candidate" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/tomcerrone/infinitetalk-comfy:${{ steps.meta.outputs.tag }}
          provenance: false
