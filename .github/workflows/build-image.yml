name: build-comfy-image

# Construit l'image custom InfiniteTalk (ComfyUI + nodes + venv + SageAttention)
# et la pousse sur ghcr.io. Déclenché manuellement ou quand le Dockerfile /
# setup-prod.sh changent.
on:
  workflow_dispatch: {}
  push:
    branches: [main, feat/slim-image]
    paths:
      - 'Dockerfile'
      - 'scripts/setup-prod.sh'
      - '.github/workflows/build-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # L'image (torch + ComfyUI + sage) dépasse l'espace par défaut du runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          docker image prune -af || true
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # main -> :latest (prod) ; branche feat/slim-image -> :slim-test (validation
          # d'un pod isolé AVANT de promouvoir en :latest, cf. build multi-étages).
          tags: ghcr.io/tomcerrone/infinitetalk-comfy:${{ github.ref == 'refs/heads/main' && 'latest' || 'slim-test' }}
          provenance: false
